<body>
    <!-- Gothic lighting and parchment filters -->
    <div class="candle-glow-1"></div>
    <div class="candle-glow-2"></div>
    <div class="vignette-overlay"></div>
    
    <div class="game-container">
        <header class="game-header">
            <div class="logo-area">
                <a href="../#aventuras" style="color: #ceb15b; text-decoration: none; font-family: 'Cinzel', serif; font-size: 0.85rem; margin-right: 15px; font-weight: 700;">⚔️ Início / Acervo</a>
                <span class="blood-accent">✙ </span>
                <span id="game-title">O SEGREDO DO MOSTEIRO</span>
            </div>
            <div class="header-controls">
                <button id="btn-narrate" class="utility-btn audio-btn" title="Ouvir Narração em Áudio">🔊 Ouvir Cena</button>
                <button id="btn-notepad" class="utility-btn" title="Abrir Diário de Investigação">📜 Diário</button>
            </div>
        </header>

        <main class="game-main">
            <!-- Main Story Panel -->
            <div class="parchment-panel">
                <div class="panel-header">
                    <span class="cross-decor">✙</span>
                    <span class="panel-title">ABADIAM SANCTI RUTERFORD // ACÓLITO JOHNATTAN</span>
                    <span class="cross-decor">✙</span>
                </div>
                <div class="panel-content">
                    <section id="text" class="story-text-container"></section>
                    <section id="options" class="story-options-container"></section>
                </div>
            </div>

            <!-- Virtual Notepad Sidebar -->
            <aside id="notepad-sidebar" class="notepad-sidebar">
                <div class="notepad-header">
                    <h3>📜 Diário do Acólito</h3>
                    <button id="btn-close-notepad" class="close-btn">&times;</button>
                </div>
                <div class="notepad-body">
                    <p class="notepad-help">Escreva aqui pistas, suspeitos, nomes ou anotações de sua investigação. Suas notas são salvas automaticamente na memória local do navegador.</p>
                    <textarea id="notepad-textarea" placeholder="Ex: Harold e Julian tinham mãos sujas de terra... Stan diz não ser louco... Malcolm tem garras?"></textarea>
                    <div class="notepad-footer">
                        <span id="notepad-status" class="status-msg">Pronto</span>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="game-footer">
            <div id="game-credits" class="credits-text"></div>
        </footer>
    </div>

    <script src="../dice-roller.js"></script>
