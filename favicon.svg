<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2015" />
      <stop offset="70%" stop-color="#14100b" />
      <stop offset="100%" stop-color="#080705" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="30%" stop-color="#e5c05d" />
      <stop offset="70%" stop-color="#ceb15b" />
      <stop offset="100%" stop-color="#8a6c22" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#8b0000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background shield -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(206, 177, 91, 0.3)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Crossed Swords (Backdrop) -->
  <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6">
    <!-- Sword 1 -->
    <line x1="120" y1="120" x2="392" y2="392" />
    <line x1="340" y1="380" x2="380" y2="340" stroke-width="14" />
    <circle cx="410" cy="410" r="10" fill="url(#goldGrad)" />
    <!-- Sword 2 -->
    <line x1="392" y1="120" x2="120" y2="392" />
    <line x1="172" y1="380" x2="132" y2="340" stroke-width="14" />
    <circle cx="102" cy="410" r="10" fill="url(#goldGrad)" />
  </g>

  <!-- Central D20 Die Structure -->
  <g transform="translate(256, 256)">
    <!-- Outer D20 Polygon -->
    <polygon points="0,-130 115,-65 115,65 0,130 -115,65 -115,-65" fill="#1b1722" stroke="url(#goldGrad)" stroke-width="8" />
    <!-- Inner Triangles -->
    <polygon points="0,-130 0,70 115,-65" fill="rgba(206, 177, 91, 0.12)" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="0,-130 0,70 -115,-65" fill="rgba(206, 177, 91, 0.22)" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="-115,-65 0,70 -115,65" fill="rgba(206, 177, 91, 0.08)" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="115,-65 0,70 115,65" fill="rgba(206, 177, 91, 0.18)" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="-115,65 0,70 0,130" fill="rgba(206, 177, 91, 0.15)" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="115,65 0,70 0,130" fill="rgba(206, 177, 91, 0.25)" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Die Number '20' -->
    <text x="0" y="22" font-family="'Cinzel', serif, system-ui" font-size="52" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">20</text>
  </g>
</svg>
