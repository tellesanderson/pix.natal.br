    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Sem Saída",
      "description": "Uma jornada angustiante em um labirinto sem fim. Você conseguirá encontrar a saída antes que seja tarde demais?",
      "genre": ["Role-Playing Game", "Text Adventure", "Cyberpunk", "Dystopian"],
      "playMode": "SinglePlayer",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "url": "https://pix.natal.br/sem-saida/",
      "image": "https://pix.natal.br/cyberpunk-bg.png",
      "author": {
        "@type": "Person",
        "name": "Anderson Telles"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Crônicas RPG"
      }
    }
    </script>

    <!-- Google Fonts for futuristic cyberpunk aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="./core/core.css" rel="stylesheet"> 
    <link href="./my-game/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Immersive animated background elements -->
    <div class="cyber-grid"></div>
    <div class="scanlines"></div>
    <div class="ambient-glow"></div>
    
    <div class="game-wrapper">
        <header class="game-header">
            <div class="logo-area">
                <span class="neon-text-blue">SYS: </span>
                <span class="neon-text-pink" id="game-title">SEM SAÍDA</span>
            </div>
            <div class="header-controls">
                <button id="btn-narrate" class="audio-btn" title="Ouvir Narração em Áudio">🔊 Ouvir Cena</button>
                <div class="status-indicator">
                    <span class="pulse-dot"></span> RUNNING_STATE: OK
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="terminal-panel">
                <div class="panel-header">
                    <div class="window-dot red"></div>
                    <div class="window-dot yellow"></div>
                    <div class="window-dot green"></div>
                    <span class="panel-title">LOG_SHELL // NEURAL_FEED</span>
                </div>
                <div class="panel-content">
                    <section id="text" class="story-text-container"></section>
                    <section id="options" class="story-options-container"></section>
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <div id="game-credits" class="credits-text"></div>
        </footer>
    </div>

    <script defer src="./core/core.js" type="module"></script>
</body>
</html>
